<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Dashboard — Christa Stamper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>* { box-sizing: border-box; margin: 0; padding: 0; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const BRAND = {
  linen: "#FAF6F0", card: "#FFFFFF", terracotta: "#A8623F",
  terracottaText: "#854A30", olive: "#6B7456", umber: "#3D352C",
  umberSoft: "#6B6258", gold: "#C9905C", border: "rgba(61,53,44,0.12)",
};

function isPaid(inv) { return (inv.status || "").trim().toLowerCase() === "paid"; }

// Converts whatever date string the sheet hands back (Google Sheets formats
// dates per the spreadsheet locale, e.g. "9/30/2026", not necessarily ISO)
// into the yyyy-mm-dd shape an <input type="date"> requires.
function toISODate(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return "";
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function fmtDateDisplay(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (isNaN(d)) return String(value);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function daysOverdueLabel(inv) {
  if (isPaid(inv) || inv.days_overdue === null || inv.days_overdue === undefined) return null;
  const n = inv.days_overdue;
  if (n > 0) return `${n} day${n === 1 ? "" : "s"} overdue`;
  if (n === 0) return "Due today";
  return `Due in ${-n} day${-n === 1 ? "" : "s"}`;
}

function App() {
  const [invoices, setInvoices] = useState(null); // null = loading
  const [loadError, setLoadError] = useState("");
  const [filter, setFilter] = useState("unpaid"); // "all" | "unpaid" | "paid"
  const [rowState, setRowState] = useState({}); // invoice_number -> { busy, error, editingDueDate, dueDateDraft }

  useEffect(() => { loadInvoices(); }, []);

  async function loadInvoices() {
    setLoadError("");
    try {
      const res = await fetch("/.netlify/functions/list-invoices");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Failed to load invoices (${res.status})`);
      setInvoices(data.invoices || []);
    } catch (err) {
      setLoadError(err.message || "Failed to load invoices.");
      setInvoices([]);
    }
  }

  function patchRow(invoiceNumber, patch) {
    setRowState(prev => ({ ...prev, [invoiceNumber]: { ...prev[invoiceNumber], ...patch } }));
  }
  function patchInvoice(invoiceNumber, patch) {
    setInvoices(prev => prev.map(inv => inv.invoice_number === invoiceNumber ? { ...inv, ...patch } : inv));
  }

  async function togglePaid(inv) {
    const invoiceNumber = inv.invoice_number;
    const nextStatus = isPaid(inv) ? "Unpaid" : "Paid";
    if (nextStatus === "Unpaid" && !window.confirm(`Mark ${invoiceNumber} back as Unpaid?`)) return;
    patchRow(invoiceNumber, { busy: true, error: "" });
    try {
      const res = await fetch("/.netlify/functions/update-invoice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ invoice_number: invoiceNumber, status: nextStatus }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Failed to update (${res.status})`);
      patchInvoice(invoiceNumber, { status: nextStatus });
    } catch (err) {
      patchRow(invoiceNumber, { error: err.message || "Failed to update status." });
    } finally {
      patchRow(invoiceNumber, { busy: false });
    }
  }

  async function sendReminderNow(inv) {
    const invoiceNumber = inv.invoice_number;
    if (!window.confirm(`Send a reminder email to ${inv.to_name || inv.email || "this client"} for ${invoiceNumber} right now?`)) return;
    patchRow(invoiceNumber, { busy: true, error: "" });
    try {
      const res = await fetch("/.netlify/functions/send-reminder-now", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ invoice_number: invoiceNumber }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Failed to send (${res.status})`);
      patchInvoice(invoiceNumber, { reminder_sent_on: new Date().toISOString().slice(0, 10) });
      patchRow(invoiceNumber, { justSent: true });
      setTimeout(() => patchRow(invoiceNumber, { justSent: false }), 4000);
    } catch (err) {
      patchRow(invoiceNumber, { error: err.message || "Failed to send reminder." });
    } finally {
      patchRow(invoiceNumber, { busy: false });
    }
  }

  function startEditDueDate(inv) {
    patchRow(inv.invoice_number, { editingDueDate: true, dueDateDraft: toISODate(inv.due_date) });
  }
  function cancelEditDueDate(invoiceNumber) {
    patchRow(invoiceNumber, { editingDueDate: false });
  }
  async function saveDueDate(inv) {
    const invoiceNumber = inv.invoice_number;
    const draft = (rowState[invoiceNumber] || {}).dueDateDraft;
    if (!draft) return;
    patchRow(invoiceNumber, { busy: true, error: "" });
    try {
      const res = await fetch("/.netlify/functions/update-invoice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ invoice_number: invoiceNumber, due_date: draft }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Failed to update (${res.status})`);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const newDue = new Date(draft); newDue.setHours(0, 0, 0, 0);
      const daysOverdue = Math.floor((today - newDue) / (1000 * 60 * 60 * 24));
      patchInvoice(invoiceNumber, { due_date: draft, days_overdue: daysOverdue });
      patchRow(invoiceNumber, { editingDueDate: false });
    } catch (err) {
      patchRow(invoiceNumber, { error: err.message || "Failed to update due date." });
    } finally {
      patchRow(invoiceNumber, { busy: false });
    }
  }

  const filtered = (invoices || []).filter(inv => {
    if (filter === "unpaid") return !isPaid(inv);
    if (filter === "paid") return isPaid(inv);
    return true;
  });

  // Most-overdue-unpaid first, then not-yet-due unpaid, then paid at the bottom.
  const sorted = [...filtered].sort((a, b) => {
    const aPaid = isPaid(a), bPaid = isPaid(b);
    if (aPaid !== bPaid) return aPaid ? 1 : -1;
    const aOver = a.days_overdue === null || a.days_overdue === undefined ? -Infinity : a.days_overdue;
    const bOver = b.days_overdue === null || b.days_overdue === undefined ? -Infinity : b.days_overdue;
    return bOver - aOver;
  });

  const unpaidCount = (invoices || []).filter(inv => !isPaid(inv)).length;
  const overdueCount = (invoices || []).filter(inv => !isPaid(inv) && inv.days_overdue > 0).length;

  return (
    <div style={{ minHeight: "100vh", background: BRAND.linen, fontFamily: "Inter, sans-serif", color: BRAND.umber }}>
      <style>{`
        .btn { border: none; border-radius: 100px; font-size: 13px; font-weight: 600; font-family: Inter, sans-serif; cursor: pointer; padding: 8px 16px; transition: background 0.15s, color 0.15s, border-color 0.15s; white-space: nowrap; }
        .btn-primary { background: ${BRAND.terracotta}; color: white; }
        .btn-primary:hover { background: ${BRAND.terracottaText}; }
        .btn-olive { background: ${BRAND.olive}; color: white; }
        .btn-olive:hover { background: #565E44; }
        .btn-ghost { background: transparent; color: ${BRAND.umberSoft}; border: 1px solid ${BRAND.border}; }
        .btn-ghost:hover { border-color: ${BRAND.terracotta}; color: ${BRAND.terracottaText}; }
        .btn-small { padding: 5px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .tab-pill { padding: 7px 16px; border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: Inter, sans-serif; transition: background 0.15s, color 0.15s; }
        .tab-on { background: ${BRAND.umber}; color: white; }
        .tab-off { background: transparent; color: ${BRAND.umberSoft}; }
        .tab-off:hover { background: rgba(61,53,44,0.06); }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .badge-paid { background: #e8f5e9; color: #2e7d32; }
        .badge-overdue { background: #fdecea; color: #b3261e; }
        .badge-unpaid { background: #fff3e0; color: #e65100; }
        table.invoices { width: 100%; border-collapse: collapse; }
        table.invoices th { text-align: left; font-size: 11px; font-weight: 600; color: ${BRAND.umberSoft}; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 10px 10px; border-bottom: 1px solid ${BRAND.border}; }
        table.invoices td { padding: 14px 10px; border-bottom: 1px solid ${BRAND.border}; font-size: 14px; vertical-align: middle; }
        .date-input { padding: 6px 8px; border: 1px solid ${BRAND.border}; border-radius: 6px; font-size: 13px; font-family: Inter, sans-serif; }
        @media (max-width: 900px) { table.invoices { font-size: 12px; } }
      `}</style>

      {/* Header */}
      <div style={{ background: BRAND.card, borderBottom: `1px solid ${BRAND.border}`, padding: "0 32px" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", height: 60 }}>
          <a href="/" style={{ display: "flex", alignItems: "center", gap: 10, textDecoration: "none", color: "inherit" }}>
            <div style={{ width: 28, height: 28, background: BRAND.olive, borderRadius: "22%", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <svg viewBox="0 0 110 70" width="16" height="10"><path d="M5 65 L35 20 L50 40 L70 10 L105 65" fill="none" stroke="#FAF6F0" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <span style={{ fontFamily: "Playfair Display, serif", fontWeight: 600, fontSize: 16 }}>Christa Stamper</span>
            <span style={{ color: BRAND.border, fontSize: 16, margin: "0 2px" }}>·</span>
            <span style={{ fontSize: 13, color: BRAND.umberSoft, fontWeight: 500 }}>Invoice Dashboard</span>
          </a>
          <a href="/invoice.html" className="btn btn-ghost" style={{ textDecoration: "none" }}>+ New invoice</a>
        </div>
      </div>

      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "32px 24px" }}>
        {/* Summary + filter */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
          <div style={{ fontSize: 13, color: BRAND.umberSoft }}>
            {invoices === null ? "Loading…" : (
              <>
                <strong style={{ color: BRAND.umber }}>{unpaidCount}</strong> unpaid
                {overdueCount > 0 && <> · <strong style={{ color: "#b3261e" }}>{overdueCount}</strong> overdue</>}
              </>
            )}
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            {[["unpaid", "Unpaid"], ["paid", "Paid"], ["all", "All"]].map(([id, text]) => (
              <button key={id} className={`tab-pill ${filter === id ? "tab-on" : "tab-off"}`} onClick={() => setFilter(id)}>{text}</button>
            ))}
            <button className="btn btn-ghost" onClick={loadInvoices}>↺ Refresh</button>
          </div>
        </div>

        {loadError && (
          <div style={{ background: "#fdecea", border: "1px solid #f5c6cb", borderRadius: 10, padding: "14px 18px", marginBottom: 20, color: "#b3261e", fontSize: 13 }}>
            {loadError}
          </div>
        )}

        <div style={{ background: BRAND.card, border: `1px solid ${BRAND.border}`, borderRadius: 12, padding: "8px 18px", overflowX: "auto" }}>
          {invoices === null ? (
            <p style={{ padding: "24px 10px", color: BRAND.umberSoft, fontSize: 14 }}>Loading invoices…</p>
          ) : sorted.length === 0 ? (
            <p style={{ padding: "24px 10px", color: BRAND.umberSoft, fontSize: 14 }}>No invoices match this filter.</p>
          ) : (
            <table className="invoices">
              <thead>
                <tr>
                  <th>Invoice</th>
                  <th>Client</th>
                  <th>Amount due</th>
                  <th>Due date</th>
                  <th>Status</th>
                  <th>Last reminder</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map(inv => {
                  const rs = rowState[inv.invoice_number] || {};
                  const paid = isPaid(inv);
                  const overdueLabel = daysOverdueLabel(inv);
                  return (
                    <tr key={inv.invoice_number}>
                      <td style={{ fontWeight: 600 }}>{inv.invoice_number}</td>
                      <td>
                        <div>{inv.to_name || inv.church_name || "—"}</div>
                        {inv.email && <div style={{ fontSize: 12, color: BRAND.umberSoft }}>{inv.email}</div>}
                      </td>
                      <td style={{ fontWeight: 600 }}>{inv.amount_due || "—"}</td>
                      <td>
                        {rs.editingDueDate ? (
                          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                            <input
                              type="date"
                              className="date-input"
                              value={rs.dueDateDraft || ""}
                              onChange={e => patchRow(inv.invoice_number, { dueDateDraft: e.target.value })}
                            />
                            <button className="btn btn-primary btn-small" disabled={rs.busy} onClick={() => saveDueDate(inv)}>Save</button>
                            <button className="btn btn-ghost btn-small" disabled={rs.busy} onClick={() => cancelEditDueDate(inv.invoice_number)}>Cancel</button>
                          </div>
                        ) : (
                          <span style={{ cursor: "pointer", borderBottom: `1px dashed ${BRAND.border}` }} onClick={() => startEditDueDate(inv)} title="Click to edit">
                            {fmtDateDisplay(inv.due_date)}
                          </span>
                        )}
                      </td>
                      <td>
                        <span className={`badge ${paid ? "badge-paid" : (overdueLabel && inv.days_overdue > 0 ? "badge-overdue" : "badge-unpaid")}`}>
                          {paid ? "Paid" : (overdueLabel || "Unpaid")}
                        </span>
                      </td>
                      <td style={{ color: BRAND.umberSoft }}>{fmtDateDisplay(inv.reminder_sent_on)}</td>
                      <td>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                          <button className="btn btn-small btn-ghost" disabled={rs.busy} onClick={() => togglePaid(inv)}>
                            {paid ? "Mark Unpaid" : "Mark Paid"}
                          </button>
                          {!paid && (
                            <button className="btn btn-small btn-olive" disabled={rs.busy} onClick={() => sendReminderNow(inv)}>
                              {rs.justSent ? "Sent ✓" : "Send reminder"}
                            </button>
                          )}
                        </div>
                        {rs.error && <div style={{ color: "#b3261e", fontSize: 12, marginTop: 4 }}>{rs.error}</div>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
