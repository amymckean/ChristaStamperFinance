<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christa Stamper — Finance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>* { box-sizing: border-box; margin: 0; padding: 0; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const BRAND = {
  linen: "#FAF6F0", card: "#FFFFFF", terracotta: "#A8623F",
  terracottaText: "#854A30", olive: "#6B7456", umber: "#3D352C",
  umberSoft: "#6B6258", gold: "#C9905C", border: "rgba(61,53,44,0.12)",
};

function isPaid(inv) { return (inv.status || "").trim().toLowerCase() === "paid"; }

function parseAmount(s) {
  const n = parseFloat(String(s || "").replace(/[^0-9.-]/g, ""));
  return isNaN(n) ? 0 : n;
}
function fmt$(n) {
  return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function Card({ href, title, description, cta }) {
  const [hover, setHover] = useState(false);
  return (
    <a
      href={href}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        display: "block", textDecoration: "none", color: BRAND.umber,
        background: BRAND.card, border: `1px solid ${hover ? BRAND.terracotta : BRAND.border}`,
        borderRadius: 14, padding: "28px 30px", flex: "1 1 280px",
        transition: "border-color 0.15s, transform 0.15s", transform: hover ? "translateY(-2px)" : "none",
      }}
    >
      <p style={{ fontFamily: "Playfair Display, serif", fontSize: 19, fontWeight: 600, marginBottom: 8 }}>{title}</p>
      <p style={{ fontSize: 14, color: BRAND.umberSoft, lineHeight: 1.6, marginBottom: 18 }}>{description}</p>
      <span style={{ fontSize: 13, fontWeight: 600, color: BRAND.terracottaText }}>{cta} →</span>
    </a>
  );
}

function App() {
  const [stats, setStats] = useState(null); // null = loading, false = failed
  const [error, setError] = useState("");

  useEffect(() => {
    fetch("/.netlify/functions/list-invoices")
      .then(res => res.json().then(data => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) throw new Error(data.error || "Failed to load invoices");
        const invoices = data.invoices || [];
        const unpaid = invoices.filter(inv => !isPaid(inv));
        const overdue = unpaid.filter(inv => inv.days_overdue > 0);
        const outstanding = unpaid.reduce((sum, inv) => sum + parseAmount(inv.amount_due), 0);
        setStats({ unpaidCount: unpaid.length, overdueCount: overdue.length, outstanding });
      })
      .catch(err => { setError(err.message || "Failed to load invoices."); setStats(false); });
  }, []);

  return (
    <div style={{ minHeight: "100vh", background: BRAND.linen, fontFamily: "Inter, sans-serif", color: BRAND.umber }}>
      <style>{`
        a.btn-ghost-link { text-decoration: none; }
        @media (max-width: 680px) { .cards { flex-direction: column !important; } }
      `}</style>

      {/* Header */}
      <div style={{ background: BRAND.card, borderBottom: `1px solid ${BRAND.border}`, padding: "0 32px" }}>
        <div style={{ maxWidth: 900, margin: "0 auto", display: "flex", alignItems: "center", height: 60 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 28, height: 28, background: BRAND.olive, borderRadius: "22%", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <svg viewBox="0 0 110 70" width="16" height="10"><path d="M5 65 L35 20 L50 40 L70 10 L105 65" fill="none" stroke="#FAF6F0" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <span style={{ fontFamily: "Playfair Display, serif", fontWeight: 600, fontSize: 16 }}>Christa Stamper</span>
            <span style={{ color: BRAND.border, fontSize: 16, margin: "0 2px" }}>·</span>
            <span style={{ fontSize: 13, color: BRAND.umberSoft, fontWeight: 500 }}>Finance</span>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: "56px 24px" }}>
        <p style={{ fontFamily: "Playfair Display, serif", fontSize: 26, fontWeight: 600, marginBottom: 10 }}>What would you like to do?</p>
        <p style={{ fontSize: 14, color: BRAND.umberSoft, marginBottom: 28 }}>
          {stats === null && "Loading your invoices…"}
          {stats === false && (error || "Couldn't load invoice stats right now.")}
          {stats && (
            <>
              <strong style={{ color: BRAND.umber }}>{stats.unpaidCount}</strong> unpaid invoice{stats.unpaidCount === 1 ? "" : "s"}
              {stats.overdueCount > 0 && <> · <strong style={{ color: "#b3261e" }}>{stats.overdueCount}</strong> overdue</>}
              {stats.outstanding > 0 && <> · <strong style={{ color: BRAND.umber }}>{fmt$(stats.outstanding)}</strong> outstanding</>}
            </>
          )}
        </p>

        <div className="cards" style={{ display: "flex", gap: 18, flexWrap: "wrap" }}>
          <Card
            href="/invoice.html"
            title="Create a new invoice"
            description="Build, preview, and email an invoice — payment links are generated automatically for both card and bank transfer."
            cta="New invoice"
          />
          <Card
            href="/dashboard.html"
            title="Invoices & reminders"
            description="See every invoice's status at a glance, mark one Paid or Unpaid, adjust a due date, or send a reminder on the spot."
            cta="View dashboard"
          />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
