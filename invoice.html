<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator — Christa Stamper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>* { box-sizing: border-box; margin: 0; padding: 0; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── Manual bank transfer info (shown on the invoice as a no-fee payment option) ──
// Fill this in with your account details, or leave blank to hide this option.
const MANUAL_BANK_INFO = "";
// ─────────────────────────────────────────────────────────────────────────────

const BRAND = {
  linen: "#FAF6F0", card: "#FFFFFF", terracotta: "#A8623F",
  terracottaText: "#854A30", olive: "#6B7456", umber: "#3D352C",
  umberSoft: "#6B6258", gold: "#C9905C", border: "rgba(61,53,44,0.12)",
};
const PROVIDER = {
  name: "Christa Stamper", title: "Biblical Counselor",
  email: "christa@christastamper.com", website: "christastamper.com",
};

function fmt$(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return "$0.00";
  return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function fmtDate(s) {
  if (!s) return "";
  return new Date(s + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}
function today() { return new Date().toISOString().split("T")[0]; }
function dueIn(days) { const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().split("T")[0]; }
function newInvNum() {
  const n = new Date();
  return `INV-${n.getFullYear().toString().slice(-2)}${String(n.getMonth()+1).padStart(2,"0")}-${String(Math.floor(Math.random()*900)+100)}`;
}

function buildInvoiceText(data) {
  const { invoiceNumber, issueDate, dueDate, church, contactName, lines, notes, subtotal, cardFee, cardTotal, achTotal, previousBalanceAmount, previousBalanceNote } = data;
  let rows = lines.map(l => {
    const descPart = l.counselee ? `${l.counselee} \u2014 ${l.description}` : l.description;
    const label = l.date ? `${fmtDate(l.date)}, ${descPart}` : descPart;
    let row = `  ${label.padEnd(45)} ${String(l.sessions).padStart(4)} x ${fmt$(l.rate).padStart(8)} = ${fmt$(l.amount).padStart(9)}`;
    if (l.notes) row += `\n      Note: ${l.notes}`;
    return row;
  }).join("\n");
  const previousBalanceLine = previousBalanceAmount > 0
    ? `Previous balance${previousBalanceNote ? " (" + previousBalanceNote + ")" : ""}: ${fmt$(previousBalanceAmount)}\n\n`
    : "";
  return `Invoice ${invoiceNumber}
Issued: ${fmtDate(issueDate)}   Due: ${fmtDate(dueDate)}

Bill to: ${church}${contactName ? " — " + contactName : ""}

${previousBalanceLine}Services:
${rows}

Amount due: ${fmt$(subtotal)}

  Paying by card:            ${fmt$(cardTotal)}  (includes ${fmt$(cardFee)} processing fee)
  Paying by bank transfer:   ${fmt$(achTotal)}  (no fee)

${notes}

Questions? Reply to this email or visit ${PROVIDER.website}`;
}

// Builds a one-page PDF of the invoice (base64, no data-URI prefix) so it can
// be sent as an email attachment via Resend. Requires jsPDF (loaded above).
function buildInvoicePdf(data) {
  const {
    invoiceNumber, issueDate, dueDate, church, contactName, lines, notes,
    subtotal, cardFee, cardTotal, achTotal, previousBalanceAmount, previousBalanceNote,
    detailed, cardLink, bankLink, manualBankInfo,
  } = data;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 50;
  const rightX = pageW - marginX;
  let y = 56;

  function ensureSpace(next) {
    if (y + next > pageH - 56) { doc.addPage(); y = 56; }
  }

  doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(0);
  doc.text(PROVIDER.name, marginX, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  doc.text(PROVIDER.title, marginX, y + 14);
  doc.text(`${PROVIDER.email}  ·  ${PROVIDER.website}`, marginX, y + 27);

  doc.setFont("helvetica", "bold"); doc.setFontSize(14);
  doc.text(`Invoice ${invoiceNumber}`, rightX, y, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  doc.text(`Issued: ${fmtDate(issueDate)}`, rightX, y + 16, { align: "right" });
  doc.text(`Due: ${fmtDate(dueDate)}`, rightX, y + 29, { align: "right" });

  y += 56;
  doc.setDrawColor(200);
  doc.line(marginX, y, rightX, y);
  y += 24;

  doc.setFont("helvetica", "bold"); doc.setFontSize(9);
  doc.text("BILL TO", marginX, y);
  y += 14;
  doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  doc.text(church || "", marginX, y);
  if (contactName) { y += 14; doc.text(contactName, marginX, y); }
  y += 26;

  if (previousBalanceAmount > 0) {
    doc.setFont("helvetica", "bold"); doc.setFontSize(10);
    doc.text("Previous balance" + (previousBalanceNote ? ` (${previousBalanceNote})` : ""), marginX, y);
    doc.text(fmt$(previousBalanceAmount), rightX, y, { align: "right" });
    y += 22;
  }

  const cols = detailed
    ? [
        { k: "date", label: "Date", x: marginX },
        { k: "counselee", label: "Counselee", x: marginX + 64 },
        { k: "description", label: "Description", x: marginX + 158, w: 190 },
        { k: "sessions", label: "Sessions", x: rightX - 140, align: "right" },
        { k: "rate", label: "Rate", x: rightX - 90, align: "right" },
        { k: "amount", label: "Amount", x: rightX, align: "right" },
      ]
    : [
        { k: "counselee", label: "Counselee", x: marginX },
        { k: "description", label: "Description", x: marginX + 94, w: 254 },
        { k: "sessions", label: "Sessions", x: rightX - 140, align: "right" },
        { k: "rate", label: "Rate", x: rightX - 90, align: "right" },
        { k: "amount", label: "Amount", x: rightX, align: "right" },
      ];

  doc.setFont("helvetica", "bold"); doc.setFontSize(8);
  cols.forEach(c => doc.text(c.label.toUpperCase(), c.x, y, c.align ? { align: c.align } : {}));
  y += 6;
  doc.setDrawColor(220);
  doc.line(marginX, y, rightX, y);
  y += 14;

  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  lines.forEach(l => {
    ensureSpace(32);
    cols.forEach(c => {
      let val = "";
      if (c.k === "date") val = l.date ? fmtDate(l.date) : "";
      else if (c.k === "counselee") val = l.counselee || "";
      else if (c.k === "description") val = l.description || "";
      else if (c.k === "sessions") val = String(l.sessions || "");
      else if (c.k === "rate") val = fmt$(l.rate);
      else if (c.k === "amount") val = fmt$(l.amount);
      doc.text(val, c.x, y, c.align ? { align: c.align } : (c.w ? { maxWidth: c.w } : {}));
    });
    y += 14;
    if (l.notes) {
      doc.setFont("helvetica", "italic"); doc.setFontSize(8.5); doc.setTextColor(120);
      doc.text(l.notes, cols.find(c => c.k === "description").x, y, { maxWidth: 220 });
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(0);
      y += 13;
    }
    y += 8;
  });

  y += 6;
  doc.setDrawColor(200);
  doc.line(marginX, y, rightX, y);
  y += 24;

  ensureSpace(90);
  doc.setFont("helvetica", "bold"); doc.setFontSize(9);
  doc.text("AMOUNT DUE", rightX, y, { align: "right" });
  y += 18;
  doc.setFontSize(18);
  doc.text(fmt$(subtotal), rightX, y, { align: "right" });
  y += 20;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  doc.text(`If paying by card: ${fmt$(cardTotal)} (includes ${fmt$(cardFee)} fee)`, rightX, y, { align: "right" });
  y += 14;
  doc.text(`If paying by bank transfer: ${fmt$(achTotal)} (no fee)`, rightX, y, { align: "right" });
  y += 26;

  if (cardLink) {
    ensureSpace(20);
    doc.setTextColor(40, 90, 160);
    doc.textWithLink(`Pay by card → ${fmt$(cardTotal)}`, marginX, y, { url: cardLink });
    doc.setTextColor(0);
    y += 18;
  }
  if (bankLink) {
    ensureSpace(20);
    doc.setTextColor(40, 90, 160);
    doc.textWithLink(`Pay by bank transfer → ${fmt$(achTotal)}`, marginX, y, { url: bankLink });
    doc.setTextColor(0);
    y += 18;
  }
  if ((manualBankInfo || "").trim()) {
    ensureSpace(40);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(90);
    doc.splitTextToSize(manualBankInfo, pageW - marginX * 2).forEach(ln => { ensureSpace(14); doc.text(ln, marginX, y); y += 12; });
    doc.setTextColor(0);
    y += 10;
  }

  if (notes) {
    ensureSpace(40);
    doc.setFont("helvetica", "italic"); doc.setFontSize(9); doc.setTextColor(90);
    doc.splitTextToSize(notes, pageW - marginX * 2).forEach(ln => { ensureSpace(14); doc.text(ln, marginX, y); y += 12; });
    doc.setTextColor(0);
  }

  return doc.output("base64");
}

function App() {
  const [church, setChurch]           = useState("");
  const [contactName, setContactName] = useState("");
  const [contactEmail, setContactEmail] = useState("");
  const [invoiceNumber]               = useState(newInvNum);
  const [issueDate]                   = useState(today);
  const [dueDate, setDueDate]         = useState(dueIn(30));
  const [lines, setLines]             = useState([{ date: "", counselee: "", description: "Biblical counseling session", sessions: "1", rate: "100", amount: "100.00", notes: "" }]);
  const [detailed, setDetailed]       = useState(false); // false = simple (sessions count per line), true = detailed (one dated line per session)
  const [notes, setNotes]             = useState("Thank you for your partnership in caring for those in your community. Payment may be made by card via the link below.");
  const [tab, setTab]                 = useState("edit"); // edit | preview | settings
  const [sendState, setSendState]     = useState("idle"); // idle | sending | sent | error
  const [sendError, setSendError]     = useState("");
  const [cardLink, setCardLink]           = useState("");
  const [cardLinkState, setCardLinkState] = useState("idle"); // idle | loading | done | error
  const [bankLink, setBankLink]           = useState("");
  const [bankLinkState, setBankLinkState] = useState("idle"); // idle | loading | done | error
  const [manualBankInfo, setManualBankInfo] = useState(MANUAL_BANK_INFO);
  const [previousBalance, setPreviousBalance] = useState("");
  const [previousBalanceNote, setPreviousBalanceNote] = useState("");

  const CARD_FEE_PCT  = 0.029; // Stripe's card rate: 2.9% + $0.30
  const CARD_FEE_FLAT = 0.30;

  const servicesSubtotal = lines.reduce((sum, l) => sum + (parseFloat(l.amount) || 0), 0);
  const previousBalanceAmount = parseFloat(previousBalance) || 0;
  const subtotal = servicesSubtotal + previousBalanceAmount;
  // Grossed up so the net received after Stripe's cut still equals the subtotal.
  const cardFee = subtotal > 0
    ? Math.round((((subtotal + CARD_FEE_FLAT) / (1 - CARD_FEE_PCT)) - subtotal) * 100) / 100
    : 0;
  const cardTotal = subtotal + cardFee;   // what they'd pay choosing card
  const achTotal   = subtotal;            // what they'd pay choosing bank transfer (no fee)
  const total = subtotal;                 // the invoice's base amount, before either payment path
  const paymentLinksState =
    (cardLinkState === "loading" || bankLinkState === "loading") ? "loading" :
    (cardLinkState === "done" && bankLinkState === "done") ? "done" :
    (cardLinkState === "error" || bankLinkState === "error") ? "error" : "idle";

  function setInvoiceStyle(isDetailed) {
    setDetailed(isDetailed);
    if (!isDetailed) {
      setLines(prev => prev.map(l => ({ ...l, date: "" })));
    }
  }

  function updateLine(i, field, val) {
    setLines(prev => {
      const next = prev.map((l, idx) => idx === i ? { ...l, [field]: val } : l);
      if (field === "sessions" || field === "rate") {
        const s = parseFloat(next[i].sessions) || 0;
        const r = parseFloat(next[i].rate) || 0;
        next[i].amount = (s * r).toFixed(2);
      }
      return next;
    });
  }

  async function createLink(method, amount) {
    const res = await fetch("/.netlify/functions/create-payment-link", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        amount,
        method,
        description: `Invoice ${invoiceNumber} — ${church || "Counseling Services"}`,
        invoiceNumber,
      }),
    });
    const data = await res.json();
    if (!data.url) throw new Error(data.error || "No URL returned");
    return data.url;
  }

  async function generatePaymentLinks() {
    if (!subtotal || subtotal <= 0) { alert("Please add at least one line item with an amount."); return; }
    setCardLinkState("loading");
    setBankLinkState("loading");

    const [cardResult, bankResult] = await Promise.allSettled([
      createLink("card", cardTotal),
      createLink("bank", achTotal),
    ]);

    if (cardResult.status === "fulfilled") {
      setCardLink(cardResult.value);
      setCardLinkState("done");
    } else {
      setCardLinkState("error");
    }

    if (bankResult.status === "fulfilled") {
      setBankLink(bankResult.value);
      setBankLinkState("done");
    } else {
      setBankLinkState("error");
    }

    const failures = [cardResult, bankResult].filter(r => r.status === "rejected");
    if (failures.length) {
      alert("Failed to generate payment link" + (failures.length > 1 ? "s" : "") + ": " + failures.map(f => f.reason.message).join("; "));
    }
  }

  async function sendInvoice() {
    if (!contactEmail) { setSendError("Please enter the church contact email."); return; }
    if (!subtotal || subtotal <= 0) { setSendError("Please add at least one line item with an amount."); return; }

    setSendState("sending");
    setSendError("");

    // Make sure both payment links exist before sending, so an invoice never
    // goes out with a placeholder instead of a real link just because the
    // "Generate payment links" button above was never clicked.
    let finalCardLink = cardLink;
    let finalBankLink = bankLink;

    if (!finalCardLink || !finalBankLink) {
      if (!finalCardLink) setCardLinkState("loading");
      if (!finalBankLink) setBankLinkState("loading");

      const [cardResult, bankResult] = await Promise.allSettled([
        finalCardLink ? Promise.resolve(finalCardLink) : createLink("card", cardTotal),
        finalBankLink ? Promise.resolve(finalBankLink) : createLink("bank", achTotal),
      ]);

      if (!finalCardLink) {
        if (cardResult.status === "fulfilled") {
          finalCardLink = cardResult.value;
          setCardLink(finalCardLink);
          setCardLinkState("done");
        } else {
          setCardLinkState("error");
        }
      }

      if (!finalBankLink) {
        if (bankResult.status === "fulfilled") {
          finalBankLink = bankResult.value;
          setBankLink(finalBankLink);
          setBankLinkState("done");
        } else {
          setBankLinkState("error");
        }
      }

      if (!finalCardLink || !finalBankLink) {
        setSendState("error");
        setSendError(
          "Couldn't generate the payment link" +
          (!finalCardLink && !finalBankLink ? "s" : "") +
          " automatically — generate it above, then send again."
        );
        return;
      }
    }

    const invoiceText = buildInvoiceText({ invoiceNumber, issueDate, dueDate, church, contactName, lines, notes, subtotal, cardFee, cardTotal, achTotal, previousBalanceAmount, previousBalanceNote });

    let invoicePdfBase64 = "";
    let pdfFailed = false;
    try {
      invoicePdfBase64 = buildInvoicePdf({ invoiceNumber, issueDate, dueDate, church, contactName, lines, notes, subtotal, cardFee, cardTotal, achTotal, previousBalanceAmount, previousBalanceNote, detailed, cardLink: finalCardLink, bankLink: finalBankLink, manualBankInfo });
    } catch (pdfErr) {
      console.error("Failed to generate the PDF attachment:", pdfErr);
      pdfFailed = true;
      // Keep sending the email even if the PDF fails to build — no attachment
      // beats no invoice at all.
    }
    console.log("[DEBUG] invoicePdfBase64 length:", invoicePdfBase64.length, "pdfFailed:", pdfFailed);

    try {
      const sendRes = await fetch("/.netlify/functions/send-invoice-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          to_email:        contactEmail,
          to_name:         contactName || church,
          church_name:     church,
          invoice_number:  invoiceNumber,
          issue_date:      fmtDate(issueDate),
          due_date:        fmtDate(dueDate),
          amount_due:      fmt$(subtotal),
          card_total:      fmt$(cardTotal),
          card_fee:        fmt$(cardFee),
          ach_total:       fmt$(achTotal),
          total_due:       fmt$(subtotal),
          notes:           notes,
          card_link:       finalCardLink,
          bank_link:       finalBankLink,
          manual_bank_info: manualBankInfo || "",
          previous_balance_label: previousBalanceAmount > 0
            ? ("Previous balance" + (previousBalanceNote ? ` (${previousBalanceNote})` : ""))
            : "",
          previous_balance_amount: previousBalanceAmount > 0 ? fmt$(previousBalanceAmount) : "",
          invoice_text:    invoiceText,
          invoice_pdf:          invoicePdfBase64,
          invoice_pdf_filename: `Invoice-${invoiceNumber}.pdf`,
          lines,
        }),
      });
      if (!sendRes.ok) {
        const errBody = await sendRes.json().catch(() => ({}));
        throw new Error(errBody.error || `Send failed (${sendRes.status})`);
      }
      setSendState("sent");
      setTimeout(() => setSendState("idle"), 4000);
      if (pdfFailed) {
        setSendError("Invoice sent, but the PDF attachment failed to generate — open the browser console (look for \"Failed to generate the PDF attachment\") for details, then try sending again.");
      }

      // Best-effort: keep the Invoices tracking sheet in sync so the reminder
      // script and the Stripe webhook can find this invoice later. A failure
      // here doesn't affect the email that already went out, but it does mean
      // this invoice won't get reminders or get auto-marked paid, so surface it.
      try {
        const syncRes = await fetch("/.netlify/functions/add-invoice-row", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            invoice_number: invoiceNumber,
            to_name: contactName || church,
            email: contactEmail,
            church_name: church,
            issue_date: issueDate,
            due_date: dueDate,
            amount_due: fmt$(subtotal),
            card_total: fmt$(cardTotal),
            card_fee: fmt$(cardFee),
            card_link: finalCardLink,
            ach_total: fmt$(achTotal),
            bank_link: finalBankLink,
            notes: notes,
          }),
        });
        if (!syncRes.ok) {
          const errBody = await syncRes.json().catch(() => ({}));
          throw new Error(errBody.error || `Sheet sync failed (${syncRes.status})`);
        }
      } catch (syncErr) {
        console.error("Failed to sync invoice to the tracking sheet:", syncErr);
        setSendError(
          (pdfFailed
            ? "Invoice sent, but the PDF attachment failed to generate, and the "
            : "Invoice sent, but the ") +
          "tracking sheet couldn't be updated automatically — add this invoice to the sheet by hand so reminders pick it up."
        );
      }
    } catch (err) {
      setSendState("error");
      setSendError(err?.message || "Failed to send.");
    }
  }

  const input = (extra = {}) => ({
    ...extra,
    style: { width: "100%", padding: "9px 12px", border: `1px solid ${BRAND.border}`, borderRadius: 8, fontSize: 14, fontFamily: "Inter, sans-serif", color: BRAND.umber, background: BRAND.card, outline: "none", ...extra.style },
  });
  const label = (text) => <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: BRAND.umberSoft, marginBottom: 5 }}>{text}</label>;
  const section = (children, extra = {}) => (
    <div style={{ background: BRAND.card, border: `1px solid ${BRAND.border}`, borderRadius: 12, padding: "24px 28px", marginBottom: 16, ...extra }}>{children}</div>
  );
  const sh = (text) => <p style={{ fontFamily: "Playfair Display, serif", fontSize: 15, fontWeight: 600, margin: "0 0 16px", color: BRAND.umber }}>{text}</p>;

  return (
    <div style={{ minHeight: "100vh", background: BRAND.linen, fontFamily: "Inter, sans-serif", color: BRAND.umber }}>
      <style>{`
        input:focus, textarea:focus, select:focus { outline: 2px solid ${BRAND.terracotta}; outline-offset: 1px; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        @media print { .no-print { display: none !important; } body { background: white; } .invoice-card { box-shadow: none !important; border: none !important; } }
        .btn { border: none; border-radius: 100px; font-size: 14px; font-weight: 600; font-family: Inter, sans-serif; cursor: pointer; padding: 11px 22px; transition: background 0.15s, color 0.15s, border-color 0.15s; }
        .btn-primary { background: ${BRAND.terracotta}; color: white; }
        .btn-primary:hover { background: ${BRAND.terracottaText}; }
        .btn-olive { background: ${BRAND.olive}; color: white; }
        .btn-olive:hover { background: #565E44; }
        .btn-ghost { background: transparent; color: ${BRAND.umberSoft}; border: 1px solid ${BRAND.border}; }
        .btn-ghost:hover { border-color: ${BRAND.terracotta}; color: ${BRAND.terracottaText}; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .line-input { padding: 8px 10px; border: 1px solid ${BRAND.border}; border-radius: 7px; font-size: 14px; font-family: Inter, sans-serif; color: ${BRAND.umber}; background: ${BRAND.card}; width: 100%; }
        .tab-pill { padding: 7px 16px; border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: Inter, sans-serif; transition: background 0.15s, color 0.15s; }
        .tab-on { background: ${BRAND.umber}; color: white; }
        .tab-off { background: transparent; color: ${BRAND.umberSoft}; }
        .tab-off:hover { background: rgba(61,53,44,0.06); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 600; }
        .badge-ok { background: #e8f5e9; color: #2e7d32; }
        .badge-warn { background: #fff3e0; color: #e65100; }
        @media (max-width: 760px) { .edit-grid { grid-template-columns: 1fr !important; } }
      `}</style>

      {/* Header */}
      <div className="no-print" style={{ background: BRAND.card, borderBottom: `1px solid ${BRAND.border}`, padding: "0 32px" }}>
        <div style={{ maxWidth: 1020, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", height: 60 }}>
          <a href="/" style={{ display: "flex", alignItems: "center", gap: 10, textDecoration: "none", color: "inherit" }}>
            <div style={{ width: 28, height: 28, background: BRAND.olive, borderRadius: "22%", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <svg viewBox="0 0 110 70" width="16" height="10"><path d="M5 65 L35 20 L50 40 L70 10 L105 65" fill="none" stroke="#FAF6F0" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <span style={{ fontFamily: "Playfair Display, serif", fontWeight: 600, fontSize: 16 }}>Christa Stamper</span>
            <span style={{ color: BRAND.border, fontSize: 16, margin: "0 2px" }}>·</span>
            <span style={{ fontSize: 13, color: BRAND.umberSoft, fontWeight: 500 }}>Invoice Generator</span>
          </a>
          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
            {[["edit","Edit"],["preview","Preview"],["settings","Settings"]].map(([id, label]) => (
              <button key={id} className={`tab-pill ${tab === id ? "tab-on" : "tab-off"}`} onClick={() => setTab(id)}>
                {label}
              </button>
            ))}
            <a href="/" className="btn btn-ghost" style={{ textDecoration: "none", marginLeft: 4 }}>Dashboard</a>
          </div>
        </div>
      </div>

      {/* Settings tab */}
      {tab === "settings" && (
        <div className="no-print" style={{ maxWidth: 600, margin: "40px auto", padding: "0 24px" }}>
          {section(<>
            {sh("Email sending")}
            <p style={{ fontSize: 13, color: BRAND.umberSoft, lineHeight: 1.6 }}>
              Invoices send through <strong>Resend</strong> — a one-time setup done entirely outside this app, in Netlify's environment variables and your Resend account (see <code style={{ background: BRAND.linen, padding: "1px 5px", borderRadius: 4 }}>SETUP.md</code>). There's nothing to configure here, and no key is ever stored in this page. The PDF attachment is generated automatically and sent with every invoice.
            </p>
          </>)}

          {section(<>
            {sh("Manual bank transfer")}
            <p style={{ fontSize: 13, color: BRAND.umberSoft, lineHeight: 1.6, marginBottom: 14 }}>
              Optional. Add your account and routing number (or other transfer instructions) and it'll appear on every invoice as a third, fee-free payment option — the church's bookkeeper can push the transfer themselves from their own bank, no Stripe verification wait involved. Leave blank to hide it.
            </p>
            {label("Transfer instructions")}
            <textarea {...input({ style: { minHeight: 90, resize: "vertical", lineHeight: 1.6 } })} value={manualBankInfo} onChange={e => setManualBankInfo(e.target.value)} placeholder={"Account name: Christa Stamper\nRouting number: 000000000\nAccount number: 000000000\nBank: Example Bank"} />
          </>)}


        </div>
      )}

      {/* Edit + Preview */}
      {tab !== "settings" && (
        <div className="edit-grid" style={{ maxWidth: 1020, margin: "0 auto", padding: "28px 24px", display: "grid", gridTemplateColumns: tab === "preview" ? "1fr" : "3fr 2fr", gap: 24 }}>

          {/* Edit form */}
          {tab === "edit" && (
            <div className="no-print">
              {section(<>
                {sh("Bill to")}
                <div style={{ display: "grid", gap: 12 }}>
                  <div>
                    {label("Church / organization name")}
                    <input {...input()} value={church} onChange={e => setChurch(e.target.value)} placeholder="Grace Community Church" />
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <div>
                      {label("Contact name")}
                      <input {...input()} value={contactName} onChange={e => setContactName(e.target.value)} placeholder="Treasurer or admin" />
                    </div>
                    <div>
                      {label("Contact email")}
                      <input {...input()} type="email" value={contactEmail} onChange={e => setContactEmail(e.target.value)} placeholder="admin@church.org" />
                    </div>
                  </div>
                </div>
              </>)}

              {section(<>
                {sh("Invoice details")}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <div>
                    {label("Invoice number")}
                    <input {...input({ style: { background: BRAND.linen, color: BRAND.umberSoft } })} value={invoiceNumber} readOnly />
                  </div>
                  <div>
                    {label("Due date")}
                    <input {...input()} type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} />
                  </div>
                </div>
              </>)}

              {section(<>
                {sh("Previous balance")}
                <p style={{ margin: "0 0 10px", fontSize: 12, color: BRAND.umberSoft }}>Optional — carries an unpaid amount from an earlier invoice onto this one.</p>
                <div style={{ display: "grid", gridTemplateColumns: "100px 1fr", gap: 10 }}>
                  <div>
                    {label("Amount")}
                    <input className="line-input" type="number" min="0" step="0.01" value={previousBalance} onChange={e => setPreviousBalance(e.target.value)} placeholder="0.00" style={{ width: "100%" }} />
                  </div>
                  <div>
                    {label("Note (optional)")}
                    <input {...input()} value={previousBalanceNote} onChange={e => setPreviousBalanceNote(e.target.value)} placeholder="e.g. Balance from Invoice INV-2609-150" />
                  </div>
                </div>
              </>)}

              {section(<>
                {sh("Services")}
                <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
                  <button type="button" className={`tab-pill ${!detailed ? "tab-on" : "tab-off"}`} onClick={() => setInvoiceStyle(false)}>Simple</button>
                  <button type="button" className={`tab-pill ${detailed ? "tab-on" : "tab-off"}`} onClick={() => setInvoiceStyle(true)}>Detailed (dated sessions)</button>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: detailed ? "118px 130px 3fr 70px 80px 80px 28px" : "130px 3fr 70px 80px 80px 28px", gap: 8, marginBottom: 8 }}>
                  {(detailed ? ["Date","Counselee","Description","Sessions","Rate","Amount",""] : ["Counselee","Description","Sessions","Rate","Amount",""]).map((h,i) => (
                    <span key={i} style={{ fontSize: 11, fontWeight: 600, color: BRAND.umberSoft, textTransform: "uppercase", letterSpacing: "0.05em" }}>{h}</span>
                  ))}
                </div>
                {lines.map((line, i) => (
                  <div key={i} style={{ marginBottom: 10, paddingBottom: 10, borderBottom: i < lines.length - 1 ? `1px solid ${BRAND.border}` : "none" }}>
                    <div style={{ display: "grid", gridTemplateColumns: detailed ? "118px 130px 3fr 70px 80px 80px 28px" : "130px 3fr 70px 80px 80px 28px", gap: 8, alignItems: "center" }}>
                      {detailed && <input className="line-input" type="date" value={line.date} onChange={e => updateLine(i,"date",e.target.value)} />}
                      <input className="line-input" value={line.counselee} onChange={e => updateLine(i,"counselee",e.target.value)} placeholder="Counselee name" />
                      <input className="line-input" value={line.description} onChange={e => updateLine(i,"description",e.target.value)} placeholder="Counseling session" />
                      <input className="line-input" type="number" min="1" value={line.sessions} onChange={e => updateLine(i,"sessions",e.target.value)} style={{ textAlign: "center" }} />
                      <input className="line-input" type="number" min="0" step="0.01" value={line.rate} onChange={e => updateLine(i,"rate",e.target.value)} />
                      <input className="line-input" value={line.amount} onChange={e => updateLine(i,"amount",e.target.value)} style={{ color: BRAND.terracottaText, fontWeight: 600 }} />
                      {lines.length > 1
                        ? <button onClick={() => setLines(p => p.filter((_,idx) => idx !== i))} style={{ background: "none", border: "none", cursor: "pointer", color: BRAND.umberSoft, fontSize: 18, padding: 0 }}>×</button>
                        : <span />}
                    </div>
                    <input className="line-input" value={line.notes} onChange={e => updateLine(i,"notes",e.target.value)} placeholder="Notes for this line (optional)" style={{ width: "100%", marginTop: 6, fontSize: 12 }} />
                  </div>
                ))}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12, paddingTop: 12, borderTop: `1px solid ${BRAND.border}` }}>
                  <button className="btn btn-ghost" style={{ padding: "7px 14px", fontSize: 13 }} onClick={() => setLines(p => [...p, { date: "", counselee: "", description: "", sessions: "", rate: "", amount: "", notes: "" }])}>+ Add line</button>
                  <div>
                    <span style={{ fontSize: 12, color: BRAND.umberSoft, marginRight: 10 }}>Services total</span>
                    <span style={{ fontFamily: "Playfair Display, serif", fontSize: 22, fontWeight: 600 }}>{fmt$(servicesSubtotal)}</span>
                  </div>
                </div>
              </>)}

              {section(<>
                {sh("Payment options")}
                <p style={{ fontSize: 12, color: BRAND.umberSoft, marginBottom: 12 }}>Shown to the church on the invoice. Every invoice needs both, so one click generates the card and bank transfer links together.</p>
                <button className="btn btn-ghost" style={{ marginBottom: 12 }} onClick={generatePaymentLinks} disabled={paymentLinksState === "loading"}>
                  {paymentLinksState === "loading" ? "Generating…" : paymentLinksState === "done" ? "↺ Regenerate links" : "Generate payment links"}
                </button>
                <div style={{ display: "grid", gap: 10 }}>
                  <div style={{ padding: "12px 14px", borderRadius: 8, border: `1px solid ${BRAND.border}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600, color: BRAND.umber }}>Card</div>
                        <div style={{ fontSize: 12, color: BRAND.umberSoft, marginTop: 2 }}>Includes {fmt$(cardFee)} processing fee (2.9% + $0.30)</div>
                      </div>
                      <div style={{ fontSize: 16, fontWeight: 600, color: BRAND.umber, whiteSpace: "nowrap" }}>{fmt$(cardTotal)}</div>
                    </div>
                    {cardLink && <div style={{ marginTop: 8, background: "#f0f7f0", border: "1px solid #c8e6c9", borderRadius: 8, padding: "8px 12px", fontSize: 12, color: BRAND.terracottaText, wordBreak: "break-all" }}>✓ {cardLink}</div>}
                  </div>
                  <div style={{ padding: "12px 14px", borderRadius: 8, border: `1px solid ${BRAND.border}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600, color: BRAND.umber }}>Bank transfer (ACH)</div>
                        <div style={{ fontSize: 12, color: BRAND.umberSoft, marginTop: 2 }}>No processing fee</div>
                      </div>
                      <div style={{ fontSize: 16, fontWeight: 600, color: BRAND.umber, whiteSpace: "nowrap" }}>{fmt$(achTotal)}</div>
                    </div>
                    {bankLink && <div style={{ marginTop: 8, background: "#f0f7f0", border: "1px solid #c8e6c9", borderRadius: 8, padding: "8px 12px", fontSize: 12, color: BRAND.terracottaText, wordBreak: "break-all" }}>✓ {bankLink}</div>}
                  </div>
                  {manualBankInfo.trim() && (
                    <div style={{ padding: "12px 14px", borderRadius: 8, border: `1px solid ${BRAND.border}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 600, color: BRAND.umber }}>Bank transfer (manual)</div>
                          <div style={{ fontSize: 12, color: BRAND.umberSoft, marginTop: 2 }}>No processing fee — they transfer directly from their bank</div>
                        </div>
                        <div style={{ fontSize: 16, fontWeight: 600, color: BRAND.umber, whiteSpace: "nowrap" }}>{fmt$(achTotal)}</div>
                      </div>
                      <div style={{ marginTop: 8, background: BRAND.linen, borderRadius: 8, padding: "8px 12px", fontSize: 12, color: BRAND.umberSoft, whiteSpace: "pre-wrap" }}>{manualBankInfo}</div>
                    </div>
                  )}
                </div>
              </>)}

              {section(<>
                {label("Notes to church")}
                <textarea {...input({ style: { minHeight: 120, resize: "vertical", lineHeight: 1.6 } })} value={notes} onChange={e => setNotes(e.target.value)} />
              </>)}

              {sendError && (
                <div style={{ background: "#fff3e0", border: "1px solid #ffcc80", borderRadius: 10, padding: "12px 16px", marginBottom: 14 }}>
                  <p style={{ margin: 0, fontSize: 13, color: "#b71c1c" }}>{sendError}</p>
                </div>
              )}

              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <button className="btn btn-olive" onClick={sendInvoice} disabled={sendState === "sending"}>
                  {sendState === "sending" ? "Sending…" : sendState === "sent" ? "✓ Sent!" : "Send invoice by email"}
                </button>
                <button className="btn btn-primary" onClick={() => setTab("preview")}>Preview</button>
              </div>

            </div>
          )}

          {/* Invoice preview */}
          <div>
            <div className="invoice-card" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}`, borderRadius: 14, overflow: "hidden", boxShadow: "0 4px 24px rgba(61,53,44,0.07)" }}>
              {/* Olive header */}
              <div style={{ background: BRAND.olive, padding: "28px 36px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 36, height: 36, background: "rgba(250,246,240,0.15)", borderRadius: "22%", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <svg viewBox="0 0 110 70" width="20" height="13"><path d="M5 65 L35 20 L50 40 L70 10 L105 65" fill="none" stroke="#FAF6F0" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </div>
                  <div>
                    <p style={{ margin: 0, fontFamily: "Playfair Display, serif", fontWeight: 600, fontSize: 17, color: "#FAF6F0" }}>{PROVIDER.name}</p>
                    <p style={{ margin: 0, fontSize: 12, color: "rgba(250,246,240,0.7)" }}>{PROVIDER.title}</p>
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <p style={{ margin: 0, fontSize: 11, color: "rgba(250,246,240,0.7)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Invoice</p>
                  <p style={{ margin: 0, fontFamily: "Playfair Display, serif", fontSize: 15, fontWeight: 600, color: "#FAF6F0" }}>{invoiceNumber}</p>
                </div>
              </div>

              <div style={{ padding: "28px 36px" }}>
                {/* Meta row */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 24, marginBottom: 28, paddingBottom: 24, borderBottom: `1px solid ${BRAND.border}` }}>
                  <div>
                    <p style={{ margin: "0 0 6px", fontSize: 11, fontWeight: 600, color: BRAND.umberSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>Bill to</p>
                    <p style={{ margin: 0, fontWeight: 600, fontSize: 14 }}>{church || "Church name"}</p>
                    {contactName && <p style={{ margin: "2px 0 0", fontSize: 13, color: BRAND.umberSoft }}>{contactName}</p>}
                    {contactEmail && <p style={{ margin: "2px 0 0", fontSize: 13, color: BRAND.terracottaText }}>{contactEmail}</p>}
                  </div>
                  <div>
                    <p style={{ margin: "0 0 6px", fontSize: 11, fontWeight: 600, color: BRAND.umberSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>Date issued</p>
                    <p style={{ margin: 0, fontSize: 14 }}>{fmtDate(issueDate)}</p>
                  </div>
                  <div>
                    <p style={{ margin: "0 0 6px", fontSize: 11, fontWeight: 600, color: BRAND.umberSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>Due date</p>
                    <p style={{ margin: 0, fontSize: 14, fontWeight: 600 }}>{fmtDate(dueDate)}</p>
                  </div>
                </div>

                {/* Previous balance */}
                {previousBalanceAmount > 0 && (
                  <div style={{ background: BRAND.linen, borderRadius: 10, padding: "14px 18px", marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div>
                      <p style={{ margin: 0, fontSize: 13, fontWeight: 600, color: BRAND.umber }}>Previous balance</p>
                      {previousBalanceNote && <p style={{ margin: "2px 0 0", fontSize: 12, color: BRAND.umberSoft }}>{previousBalanceNote}</p>}
                    </div>
                    <p style={{ margin: 0, fontSize: 16, fontWeight: 600, color: BRAND.umber }}>{fmt$(previousBalanceAmount)}</p>
                  </div>
                )}

                {/* Line items */}
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 20 }}>
                  <thead>
                    <tr style={{ borderBottom: `1px solid ${BRAND.border}` }}>
                      {(detailed ? ["Date","Counselee","Description","Sessions","Rate","Amount"] : ["Counselee","Description","Sessions","Rate","Amount"]).map((h,i) => (
                        <th key={i} style={{ padding: "0 0 8px", textAlign: (detailed ? (i===0||i===1||i===2) : (i===0||i===1)) ? "left" : "right", fontSize: 11, fontWeight: 600, color: BRAND.umberSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {lines.map((line, i) => (
                      <tr key={i} style={{ borderBottom: `1px solid ${BRAND.border}` }}>
                        {detailed && <td style={{ padding: "12px 0", fontSize: 14, color: BRAND.umberSoft, whiteSpace: "nowrap" }}>{line.date ? fmtDate(line.date) : "—"}</td>}
                        <td style={{ padding: "12px 0", fontSize: 14 }}>{line.counselee || "—"}</td>
                        <td style={{ padding: "12px 0", fontSize: 14 }}>
                          {line.description || "—"}
                          {line.notes && <div style={{ fontSize: 11, color: BRAND.umberSoft, fontStyle: "italic", marginTop: 2 }}>{line.notes}</div>}
                        </td>
                        <td style={{ padding: "12px 0", fontSize: 14, color: BRAND.umberSoft, textAlign: "right" }}>{line.sessions}</td>
                        <td style={{ padding: "12px 0", fontSize: 14, color: BRAND.umberSoft, textAlign: "right" }}>{fmt$(line.rate)}</td>
                        <td style={{ padding: "12px 0", fontSize: 14, fontWeight: 600, textAlign: "right" }}>{fmt$(line.amount)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {/* Total */}
                <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 24 }}>
                  <div style={{ background: BRAND.linen, borderRadius: 10, padding: "14px 20px", minWidth: 260, textAlign: "right" }}>
                    <p style={{ margin: "0 0 4px", fontSize: 11, fontWeight: 600, color: BRAND.umberSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>Amount due</p>
                    <p style={{ margin: "0 0 10px", fontFamily: "Playfair Display, serif", fontSize: 26, fontWeight: 600 }}>{fmt$(subtotal)}</p>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 24, fontSize: 12, color: BRAND.umberSoft, paddingTop: 8, borderTop: `1px solid ${BRAND.border}` }}>
                      <span>If paying by card</span><span style={{ fontWeight: 600, color: BRAND.umber }}>{fmt$(cardTotal)}</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 24, fontSize: 12, color: BRAND.umberSoft, marginTop: 4 }}>
                      <span>If paying by bank transfer</span><span style={{ fontWeight: 600, color: BRAND.umber }}>{fmt$(achTotal)}</span>
                    </div>
                  </div>
                </div>

                {/* Payment links */}
                {cardLink && (
                  <div style={{ background: "#f0f7f0", border: "1px solid #c8e6c9", borderRadius: 10, padding: "14px 18px", marginBottom: 12 }}>
                    <p style={{ margin: "0 0 4px", fontSize: 11, fontWeight: 600, color: "#2e7d32", textTransform: "uppercase", letterSpacing: "0.06em" }}>Pay by card — {fmt$(cardTotal)}</p>
                    <a href={cardLink} style={{ fontSize: 13, color: BRAND.terracottaText, wordBreak: "break-all" }}>{cardLink}</a>
                  </div>
                )}
                {bankLink && (
                  <div style={{ background: "#f0f7f0", border: "1px solid #c8e6c9", borderRadius: 10, padding: "14px 18px", marginBottom: 12 }}>
                    <p style={{ margin: "0 0 4px", fontSize: 11, fontWeight: 600, color: "#2e7d32", textTransform: "uppercase", letterSpacing: "0.06em" }}>Pay by bank transfer (ACH) — {fmt$(achTotal)}</p>
                    <a href={bankLink} style={{ fontSize: 13, color: BRAND.terracottaText, wordBreak: "break-all" }}>{bankLink}</a>
                  </div>
                )}
                {manualBankInfo.trim() && (
                  <div style={{ background: BRAND.linen, borderRadius: 10, padding: "14px 18px", marginBottom: 16 }}>
                    <p style={{ margin: "0 0 4px", fontSize: 11, fontWeight: 600, color: BRAND.umberSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>Or pay by bank transfer (manual) — {fmt$(achTotal)}</p>
                    <p style={{ margin: 0, fontSize: 13, color: BRAND.umber, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{manualBankInfo}</p>
                  </div>
                )}

                {/* Notes */}
                {notes && (
                  <div style={{ background: BRAND.linen, borderRadius: 10, padding: "14px 18px", marginBottom: 20 }}>
                    <p style={{ margin: 0, fontSize: 13, color: BRAND.umberSoft, lineHeight: 1.6 }}>{notes}</p>
                  </div>
                )}

                {/* Footer */}
                <div style={{ borderTop: `1px solid ${BRAND.border}`, paddingTop: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <p style={{ margin: 0, fontSize: 12, color: BRAND.umberSoft }}>{PROVIDER.email}</p>
                    <p style={{ margin: "2px 0 0", fontSize: 12, color: BRAND.umberSoft }}>{PROVIDER.website}</p>
                  </div>
                  <p style={{ margin: 0, fontSize: 11, color: BRAND.umberSoft, opacity: 0.4 }}>Thank you for your partnership.</p>
                </div>
              </div>
            </div>

            {/* Preview actions */}
            {tab === "preview" && (
              <div className="no-print" style={{ display: "flex", gap: 10, marginTop: 16, justifyContent: "center", flexWrap: "wrap" }}>
                <button className="btn btn-olive" onClick={sendInvoice} disabled={sendState === "sending"}>
                  {sendState === "sending" ? "Sending…" : sendState === "sent" ? "✓ Sent!" : "Send by email"}
                </button>
                <button className="btn btn-primary" onClick={() => window.print()}>Download PDF</button>
                <button className="btn btn-ghost" onClick={() => setTab("edit")}>Edit</button>
              </div>
            )}
            {sendError && tab === "preview" && (
              <p style={{ textAlign: "center", fontSize: 13, color: "#b71c1c", marginTop: 10 }}>{sendError}</p>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
